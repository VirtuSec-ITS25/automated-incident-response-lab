# Inventory for automated incident response lab
# Defines target hosts for Wazuh manager and agents

[wazuh_manager]
wazuh-manager ansible_host=192.168.56.10

[wazuh_agents]
web-agent ansible_host=192.168.56.11
db-agent ansible_host=192.168.56.12

[all:vars]
# Connection settings for vagrant user and SSH authentication
ansible_user=vagrant
ansible_ssh_private_key_file=/home/vagrant/.ssh/id_ed25519
