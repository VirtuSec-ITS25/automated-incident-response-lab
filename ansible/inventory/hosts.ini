# ⚠️  Replace 100.x.x.x with your actual Tailscale IPs!
#     Find the IP inside each VM with: tailscale ip -4

[wazuh_manager]
wazuh-manager ansible_host=100.x.x.x

[wazuh_agents]
server1 ansible_host=100.x.x.x

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
