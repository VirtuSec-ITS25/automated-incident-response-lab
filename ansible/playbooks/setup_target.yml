---
- name: Prepare attack target (server1)
  hosts: wazuh_agents
  become: yes
  tasks:
    - name: Install OpenSSH server
      apt:
        name: openssh-server
        state: present
        update_cache: yes

    - name: Create test user for brute force
      user:
        name: testuser
        password: "{{ 'password123' | password_hash('sha512') }}"
        state: present
        shell: /bin/bash

    - name: Enable password authentication via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
      notify: Restart SSH

    - name: Install UFW firewall
      apt:
        name: ufw
        state: present

    - name: Enable UFW and allow SSH
      ufw:
        rule: allow
        name: OpenSSH
        state: enabled

  handlers:
    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
