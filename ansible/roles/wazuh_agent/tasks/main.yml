- name: Download and dearmor Wazuh GPG key
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | \
    gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    filename: wazuh
    state: present

- name: Ensure wazuh group exists
  group:
    name: wazuh
    state: present

- name: Install wazuh-agent
  apt:
    name: wazuh-agent
    update_cache: yes
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    WAZUH_AGENT_NAME: "{{ wazuh_agent_name }}"

- name: Reload systemd after wazuh-agent install
  systemd:
    daemon_reload: yes

- name: Deploy ossec.conf from template
  template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: restart wazuh-agent

- name: Configure agent to monitor auth.log
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - auth.log"
    block: |
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>
  notify: restart wazuh-agent

- name: Enable and start wazuh-agent
  systemd:
    name: wazuh-agent
    enabled: yes
    state: started