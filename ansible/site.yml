---
# Install Wazuh Manager All-in-One

- name: Install Wazuh Manager
  hosts: wazuh_manager
  become: yes
  tasks:
    - name: Download Wazuh installation script
      get_url:
        url: https://packages.wazuh.com/4.14/wazuh-install.sh
        dest: /tmp/wazuh-install.sh
        mode: "0700"

    - name: Run the all-in-one installer
      command: bash /tmp/wazuh-install.sh -a
      args:
        creates: /var/ossec/bin/wazuh-control

- name: Configure Wazuh agents
  hosts: wazuh_agents
  become: yes
  roles:
    - wazuh_agent