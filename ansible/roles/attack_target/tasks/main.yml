---
- name: Install OpenSSH server
  apt:
    name: openssh-server
    state: present
    update_cache: yes

- name: Create test user for brute force
  user:
    name: testuser
    password: "{{ 'felkod123' | password_hash('sha512', 'labsalt0123456') }}"
    state: present
    shell: /bin/bash

- name: Enable password authentication via SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: Restart SSH

- name: Override cloud-init SSH settings
  lineinfile:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: Restart SSH

- name: Install UFW firewall
  apt:
    name: ufw
    state: present

- name: Enable UFW and allow SSH
  ufw:
    rule: allow
    name: OpenSSH
    state: enabled