---
# Scans the SSH host keys from web-agent and db-agent and adds them
# to ~/.ssh/known_hosts so Ansible can connect without manual confirmation.
- name: Add agent SSH keys to known_hosts
  hosts: wazuh_manager
  become: no
  tasks:
    - name: Scan and add agent host keys
      known_hosts:
        name: "{{ item }}"
        key: "{{ lookup('pipe', 'ssh-keyscan ' + item) }}"
        state: present
      loop:
        - "{{ hostvars['web-agent'].ansible_host }}"
        - "{{ hostvars['db-agent'].ansible_host }}"

# Install Wazuh Manager All-in-One
- name: Install Wazuh Manager
  hosts: wazuh_manager
  become: yes
  tasks:
    - name: Download Wazuh installation script
      get_url:
        url: https://packages.wazuh.com/4.14/wazuh-install.sh
        dest: /tmp/wazuh-install.sh
        mode: "0700"

    - name: Run the all-in-one installer
      command: bash /tmp/wazuh-install.sh -a
      args:
        creates: /var/ossec/bin/wazuh-control

    - name: Wait for Wazuh manager to be ready on port 1514
      wait_for:
        host: "{{ ansible_host }}"
        port: 1514
        timeout: 120

# Installs and configures the Wazuh agent on all hosts in [wazuh_agents]
- name: Configure Wazuh agents
  hosts: wazuh_agents
  become: yes
  roles:
    - wazuh_agent